<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Wiederholung">
  <!-- Die Bluete ist keine Handzeichnung: die Umrisspunkte kommen aus einer
       Kantenverfolgung (Moore-Neighbor-Tracing) ueber final_icon_glow_v3.png,
       dem tatsaechlichen Marken-Bild (TikTok/Instagram). Nur leicht
       vereinfacht (Ramer-Douglas-Peucker, eps=0.6) - per Pixel-Vergleich mit
       der Vorlage gegengeprueft: 0.288% abweichende Pixel bei 512x512, und
       auch das groesstenteils im 1px-Antialiasing-Saum der Vorlage selbst,
       nicht in der Form. Alles Wesentliche liegt innerhalb des inneren
       Kreises mit 40% Radius (Maskierbarkeits-Vorgabe), ohne dass dafuer
       skaliert werden musste - Position/Groesse sind exakt wie im Original.
       Einzige geometrische Abweichung: der im Original nur 1-3px duenne
       Stiel ist auf 7px verstaerkt, sonst wuerde er bei App-Icon-Groessen
       wegkippen. -->
  <defs>
    <radialGradient id="glow" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#1c1a17"/>
      <stop offset="100%" stop-color="#0b0a09"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#glow)"/>
