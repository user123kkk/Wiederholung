<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Wiederholung">
  <!-- Maskierbar: alles Wesentliche liegt im inneren Kreis mit 40 % Radius,
       damit Android nichts davon wegschneidet, wenn es das Symbol in eine
       eigene Form stanzt. Deckungsgleich mit der Marke in app.js (ikon
       "marke") und dem Auftritt auf TikTok/Instagram - dieselbe Bluete,
       nur hier als eigenstaendige, nicht theme-abhaengige Datei. -->
  <defs>
