<!DOCTYPE html>
<!-- csp-build: 3.4.10 -- reine Merkzeile ohne Wirkung im Browser. Aendert sich
     ausschliesslich firebase.json (z.B. die Content-Security-Policy), aendert
     sich sonst KEIN Datei-Byte hier - Firebase Hosting liefert dann fuer schon
     cachende Clients per bedingtem GET ein 304 zurueck, und ein 304 aktualisiert
     die im Browser gespeicherten Header (u.a. die CSP) nicht zuverlaessig. Diese
     Zeile bei jeder reinen Header-Aenderung mithochzaehlen erzwingt einen neuen
     ETag und damit einen echten frischen 200 statt eines 304 mit alten Headern. -->
<html lang="de">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover: erst damit liefert env(safe-area-inset-*) echte Werte
     und der Inhalt rutscht im App-Modus nicht unter Uhr und Kerbe. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Adrabic</title>
<!-- Login/App-Bereich – wird bewusst nicht indexiert (Phase 7, SEO), siehe
     robots.txt: dort steht der öffentliche Inhalt, hier persönliche Daten. -->
<meta name="robots" content="noindex, nofollow">
<meta name="google-site-verification" content="z3bPZyU2P8njPDycALXFagDf96zwxJPurvHRPghaUv8" />
<meta name="apple-mobile-web-app-title" content="Adrabic">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111010">
<!-- Sagt dem Browser, dass die Seite dunkel ist: Bedienfelder, Rollbalken und
     Textfelder kommen dann von selbst in Dunkelfassung statt in Weiss. -->
<meta name="color-scheme" content="dark">
<!-- Beobachtung 16 (16.09.2026, Verdachts-Fix, unbestätigt): initFirebase()
     laedt sein SDK erst als dynamischer Import spaeter im Skript - die
     Verbindung zu gstatic.com beginnt also erst dann aufzubauen. Nach einer
     echten Browser-Zurueck-Navigation (bestaetigt: kein bfcache, echtes
     Neuladen) priorisiert der Browser neue Verbindungen mitunter anders als
     bei einem gewoehnlichen ersten Aufruf - preconnect baut TCP/TLS zu
     gstatic.com schon waehrend des HTML-Parsens auf, parallel zu Skript und
     Stylesheet, statt erst beim dynamischen Import. Reine Verbindungs-
     Vorbereitung, kein Laden einer Ressource - CSP erlaubt gstatic.com
     ohnehin bereits (script-src/connect-src, firebase.json). -->
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="dns-prefetch" href="https://www.gstatic.com">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./desktop-icon.png" type="image/png">
<!-- Safari kann kein SVG als Homescreen-Symbol - ohne PNG blieb das Symbol
     beim "Zum Home-Bildschirm" leer bzw. wurde durch einen Seiten-Screenshot
     ersetzt. 180x180 ist Apples eigene Empfehlung (Retina-Icon). -->
<link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
<link rel="stylesheet" href="./styles.css?v=3.12.1">
<script>
/* 2.20.0: Läuft, BEVOR das erste Bild steht.

   Die gewählte Fassung liegt im Konto und kommt erst mit den Daten aus der
   Cloud - das dauert einen Moment. Ohne diese Zeilen sähe ein Nutzer mit
   heller Fassung bei jedem Start zuerst einen schwarzen Bildschirm, der dann
   umspringt. Das sieht nach einem Fehler aus. Deshalb liegt die Wahl
   zusätzlich auf dem Gerät selbst; die Cloud bleibt maßgeblich und
   überschreibt sie, sobald sie da ist. */
(function () {
  try {
    var w = localStorage.getItem("adrabic-thema") || "dunkel";
    var hell = w === "hell" || (w === "auto" && window.matchMedia &&
               window.matchMedia("(prefers-color-scheme: light)").matches);
    document.documentElement.setAttribute("data-thema", hell ? "hell" : "dunkel");
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute("content", hell ? "#f2ece0" : "#111010");
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="bg-glow" aria-hidden="true"></div>
<div class="container" id="app">
  <!-- Beobachtung 12: bis hierhin ist app.js noch nicht gelaufen (Modul-
       Skripte werden erst nach dem Parsen ausgefuehrt). Deshalb steht der
       Ladebildschirm schon hier im HTML - reines CSS (styles.css, .boot__*),
       er bewegt sich also, bevor ueberhaupt ein Skript gelaufen ist.
       3.12.1: neuer Ladebildschirm, ein kleiner Kartenstapel, dessen oberste
       Karte sich dreht (app.js, bootStapel). Dieses Markup MUSS dem von
       bootStapel() entsprechen - sonst springt der Bildschirm, wenn render()
       ihn ablöst. Das Zeichen steht hier als SVG mit demselben Pfad wie
       ICON_PFADE.marke in app.js. -->
  <div class="boot">
    <div class="boot__stapel" aria-hidden="true">
      <span class="boot__blatt boot__blatt--2"></span><span class="boot__blatt boot__blatt--1"></span>
      <span class="boot__karte"><span class="boot__dreh">
        <span class="boot__seite"><svg class="i boot__zeichen" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" stroke="none" d="M11.53,15.02L9.3,14.84L9.21,14.74L8.74,14.74L8.65,14.65L7.63,14.47L7.53,14.37L7.07,14.28L6.79,14.09L6.6,14.09L5.3,13.44L4.65,12.98L3.44,11.77L2.6,10.28L2.6,10.09L2.42,9.72L2.42,9.44L2.33,9.35L2.33,8.98L2.23,8.88L2.14,7.58L3.72,7.67L3.81,7.77L4.28,7.77L4.37,7.86L4.65,7.86L5.12,8.05L5.4,8.05L5.49,7.95L5.4,7.86L5.4,7.3L5.3,7.21L5.3,5.44L5.4,5.35L5.49,4.23L5.58,4.14L5.58,3.86L5.67,3.77L5.67,3.49L5.77,3.4L5.86,2.93L6.88,3.4L8.09,4.23L9.3,5.44L9.77,6.09L9.86,6L10.14,4.98L10.6,3.95L10.79,3.77L11.16,3.02L12,2L12.84,3.02L12.93,3.3L13.4,3.95L13.86,4.98L13.86,5.16L14.23,6.09L14.7,5.44L15.91,4.23L17.12,3.4L18.14,2.93L18.14,3.12L18.33,3.49L18.33,3.77L18.42,3.86L18.42,4.14L18.51,4.23L18.6,5.35L18.7,5.44L18.7,7.21L18.6,7.3L18.6,7.86L18.51,7.95L18.6,8.05L18.88,8.05L18.98,7.95L19.26,7.95L19.72,7.77L20.19,7.77L20.28,7.67L21.86,7.58L21.77,8.88L21.67,8.98L21.58,9.72L20.93,11.21L20.56,11.77L19.35,12.98L18.7,13.44L17.4,14.09L17.21,14.09L16.93,14.28L16.74,14.28L16.37,14.47L16.09,14.47L16,14.56L15.72,14.56L15.26,14.74L14.79,14.74L14.7,14.84L14.14,14.84L14.05,14.93L13.02,14.93L12.93,15.02L11.53,15.02Z"/><path d="M11.95,15.02L12,22"/></svg></span>
        <span class="boot__seite boot__seite--hinten" lang="ar" dir="rtl">كِتَابٌ</span>
      </span></span>
    </div>
    <div class="boot__marke">Adrabic</div>
    <div class="boot__punkte" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
    <p class="boot__text" role="status">Deine Karten werden geladen…</p>
  </div>
</div>

<!-- Fehlerformular-Modal: liegt bewusst ausserhalb von #app, siehe app.js -->
<div class="error-modal" id="errorModal" aria-hidden="true">
  <div class="error-modal__backdrop" aria-hidden="true"></div>
  <div class="error-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="error-modal-title">
    <div class="error-modal__header">
      <h2 class="error-modal__title" id="error-modal-title">Fehler melden</h2>
      <button class="error-modal__close" aria-label="Dialog schließen" data-action="close-error-modal">×</button>
    </div>
    <form class="error-modal__form" id="errorForm">
      <div class="field">
        <label for="error-name">Dein Name (optional)</label>
        <input type="text" id="error-name" name="name" maxlength="100" placeholder="z.B. Sarah">
      </div>
      <div class="field">
        <label for="error-email">Deine E-Mail (optional)</label>
        <input type="email" id="error-email" name="email" maxlength="200" placeholder="z.B. sarah@example.com">
      </div>
      <div class="field">
        <label for="error-description">Fehlerbeschreibung *</label>
        <textarea id="error-description" name="description" required maxlength="5000" placeholder="Was funktioniert nicht? Wann tritt der Fehler auf?"></textarea>
      </div>
      <input type="text" name="website" class="error-modal__honeypot" tabindex="-1" autocomplete="off">
      <div class="form-actions">
        <button type="submit">Fehler melden</button>
        <button type="button" class="secondary" data-action="close-error-modal">Abbrechen</button>
      </div>
      <p class="hint" style="margin-top:var(--space-3)">
        Deine Daten werden nur zur Beantwortung deiner Anfrage genutzt. Siehe <a href="./datenschutzerklaerung.html">Datenschutzerklärung</a>.
      </p>
    </form>
  </div>
</div>

<!-- Versions-Query zwingt jeden Browser, der die Seite frisch laedt (siehe
     Cache-Control fuer .html: max-age=0), app.js NEU zu holen statt aus dem
     eigenen 1-Stunden-HTTP-Cache zu bedienen (Cache-Control fuer .js:
     max-age=3600, siehe firebase.json). Bei jeder Veroeffentlichung MUSS
     dieser Wert auf APP_VERSION mitgezogen werden - sonst haengen Browser,
     die die App innerhalb der letzten Stunde offen hatten, an der alten
     app.js fest, auch nach einem Reload. -->
<script type="module" src="./app.js?v=3.12.1"></script>
</body>
</html>
