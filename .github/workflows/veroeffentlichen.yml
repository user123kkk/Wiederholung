# Dasselbe wie veroeffentlichen.bat, aber von jedem Geraet aus:
# GitHub -> Actions -> "Veroeffentlichen" -> "Run workflow".
# Laeuft NUR auf Knopfdruck - ein Push auf main veroeffentlicht nichts.
# Braucht das Repository-Secret FIREBASE_SERVICE_ACCOUNT (JSON-Schluessel
# eines Dienstkontos mit der Rolle "Firebase Hosting Admin").
name: Veroeffentlichen

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: veroeffentlichen
  cancel-in-progress: false

jobs:
  hosting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # LEHREN.md § 4.1/§ 4.2/§ 9.2: Version an vier Stellen, CHANGELOG, node --check,
      # CSP-Hashes, APP_SHELL. Bricht vor dem Deploy ab, wenn etwas nicht stimmt.
      - name: Stand pruefen
        run: node plan/werkzeuge/pruefe_stand.mjs

      - name: Auf Firebase Hosting veroeffentlichen
        env:
          SCHLUESSEL: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SCHLUESSEL" ]; then echo "Secret FIREBASE_SERVICE_ACCOUNT fehlt"; exit 1; fi
          trap 'rm -f "$RUNNER_TEMP/sa.json"' EXIT
          printf '%s' "$SCHLUESSEL" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx -y firebase-tools@15 deploy --only hosting --project lernkarte-925c2 --non-interactive
